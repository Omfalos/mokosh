name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Fast, informative-only signal on PR branches: runs only the tests mokosh's own
  # dependency graph says are affected by the diff against the PR base. NOT a required
  # check — the affected-tests heuristic is static-import-graph based and can miss
  # dynamic/reflection-based coupling, so it must never be what gates a merge. Its job
  # is quick iteration feedback while `build` (full suite, required) is still running.
  affected:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - run: npm ci
    - run: npm run build
    - run: scripts/test-affected.sh "origin/$BASE_REF"
      env:
        # Passed via env rather than interpolated into the run: script directly — a base_ref
        # containing shell metacharacters would otherwise be substituted before execution.
        BASE_REF: ${{ github.base_ref }}

  # Smoke-runs the multi-framework demo app under example/e2e-demo/ — vitest,
  # Playwright, Cucumber.js (Gherkin + real step-definitions), pytest, and go test.
  # This proves those example tests are actually executable, not just static
  # fixtures for the tag-applier unit tests. Not required for merge: it exercises
  # example code, not the published package, and its toolchain (Python/Go) is
  # unrelated to what changed on most PRs.
  examples:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: 22.x
        cache: 'npm'

    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - uses: actions/setup-go@v5
      with:
        go-version: '1.21'

    - run: npm ci
    - run: pip install pytest

    - run: npm run example:vitest
    - run: npm run example:playwright
    - run: npm run example:gherkin
    - run: npm run example:pytest
    - run: npm run example:go

  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 22.x, 24.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - run: npm ci

    - name: Lint and Format Check
      run: npm run check

    - name: TypeScript Check
      run: npm run typecheck

    - name: Build
      run: npm run build

    - name: Run Tests
      run: npm test
